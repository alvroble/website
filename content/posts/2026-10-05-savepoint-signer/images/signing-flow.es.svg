<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 683" role="img" aria-labelledby="title desc"><title id="title">De una propuesta de transacción a una firma</title><desc id="desc">La transacción sintética pública de este tutorial no se puede difundir.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10" fill="#9bbc9c"/></marker></defs><rect width="760" height="683" rx="12" fill="#141b17"/><text x="36" y="48" fill="#f0c386" font-family="monospace" font-size="22">De una propuesta de transacción a una firma</text>
<rect x="36" y="85" width="688" height="94" rx="6" fill="#202b23" stroke="#485b4a"/><text x="58" y="119" fill="#ecf0e7" font-family="monospace" font-size="19">Coordinador de escritorio → PSBT binaria sin firmar</text><text x="58" y="151" fill="#becabc" font-family="sans-serif" font-size="18">Una entrada, una o dos salidas y metadatos de pertenencia</text>
<path d="M380 179V201" stroke="#9bbc9c" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="36" y="207" width="688" height="94" rx="6" fill="#202b23" stroke="#485b4a"/><text x="58" y="241" fill="#ecf0e7" font-family="monospace" font-size="19">microSD → cartucho → revisión en Crystal</text><text x="58" y="273" fill="#becabc" font-family="sans-serif" font-size="18">Verifica identidad, destinatarios, importes, cambio y comisión</text>
<path d="M380 301V323" stroke="#9bbc9c" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="36" y="329" width="688" height="94" rx="6" fill="#202b23" stroke="#485b4a"/><text x="58" y="363" fill="#ecf0e7" font-family="monospace" font-size="19">Aprobación explícita → firma RP2350 → exportación a SD</text><text x="58" y="395" fill="#becabc" font-family="sans-serif" font-size="18">La revisión queda vinculada a la sesión y a la transacción</text>
<path d="M380 423V445" stroke="#9bbc9c" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="36" y="451" width="688" height="94" rx="6" fill="#202b23" stroke="#485b4a"/><text x="58" y="485" fill="#ecf0e7" font-family="monospace" font-size="19">PSBT firmada → coordinador de escritorio</text><text x="58" y="517" fill="#becabc" font-family="sans-serif" font-size="18">Importa, verifica y finaliza; difunde solo pruebas con cuentas desechables</text>
<text x="36" y="651" fill="#becabc" font-family="sans-serif" font-size="16">La transacción sintética pública de este tutorial no se puede difundir.</text></svg>