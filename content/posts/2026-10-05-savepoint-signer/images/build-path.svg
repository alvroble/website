<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 683" role="img" aria-labelledby="title desc"><title id="title">Build two artifacts. Install them differently.</title><desc id="desc">The .gbc file is a game ROM. It is not the cartridge firmware.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10" fill="#9bbc9c"/></marker></defs><rect width="760" height="683" rx="12" fill="#141b17"/><text x="36" y="48" fill="#f0c386" font-family="monospace" font-size="24">Build two artifacts. Install them differently.</text>
