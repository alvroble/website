<path d="M380 301V323" stroke="#9bbc9c" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="36" y="329" width="688" height="94" rx="6" fill="#202b23" stroke="#485b4a"/><text x="58" y="363" fill="#ecf0e7" font-family="monospace" font-size="21">Pinned pokecrystal + source patch + RGBDS 1.0.3</text><text x="58" y="395" fill="#becabc" font-family="sans-serif" font-size="18">build.py → pokecrystal.gbc + symbols + manifest</text>
