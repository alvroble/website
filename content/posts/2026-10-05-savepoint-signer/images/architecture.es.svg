<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 683" role="img" aria-labelledby="title desc"><title id="title">Un cartucho, dos equipos que cooperan</title><desc id="desc">El monedero de escritorio crea transacciones y finaliza las PSBT firmadas.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10" fill="#9bbc9c"/></marker></defs><rect width="760" height="683" rx="12" fill="#141b17"/><text x="36" y="48" fill="#f0c386" font-family="monospace" font-size="22">Un cartucho, dos equipos que cooperan</text>
<rect x="36" y="85" width="688" height="94" rx="6" fill="#202b23" stroke="#485b4a"/><text x="58" y="119" fill="#ecf0e7" font-family="monospace" font-size="19">Game Boy Color / Advance / SP</text><text x="58" y="151" fill="#becabc" font-family="sans-serif" font-size="18">Botones + pantalla de 160 × 144 + interfaz de Crystal modificada</text>
<path d="M380 179V201" stroke="#9bbc9c" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="36" y="207" width="688" height="94" rx="6" fill="#202b23" stroke="#485b4a"/><text x="58" y="241" fill="#ecf0e7" font-family="monospace" font-size="19">Bus del cartucho → interfaz de órdenes por páginas</text><text x="58" y="273" fill="#becabc" font-family="sans-serif" font-size="18">Orden, identificador, página → instantánea estable de respuesta</text>
<path d="M380 301V323" stroke="#9bbc9c" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="36" y="329" width="688" height="94" rx="6" fill="#202b23" stroke="#485b4a"/><text x="58" y="363" fill="#ecf0e7" font-family="monospace" font-size="19">RP2350: control de bancos + proceso de firma</text><text x="58" y="395" fill="#becabc" font-family="sans-serif" font-size="18">Núcleo 0: atiende al juego; núcleo 1: firma y SD</text>
<path d="M380 423V445" stroke="#9bbc9c" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="36" y="451" width="688" height="94" rx="6" fill="#202b23" stroke="#485b4a"/><text x="58" y="485" fill="#ecf0e7" font-family="monospace" font-size="19">microSD: juegos, partidas, PSBT sin firmar y firmadas</text><text x="58" y="517" fill="#becabc" font-family="sans-serif" font-size="18">FAT32; sin persistencia deliberada de la semilla</text>
<text x="36" y="651" fill="#becabc" font-family="sans-serif" font-size="16">El monedero de escritorio crea transacciones y finaliza las PSBT firmadas.</text></svg>