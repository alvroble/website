<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 683" role="img" aria-labelledby="title desc"><title id="title">One cartridge, two cooperating computers</title><desc id="desc">The desktop wallet constructs transactions and finalizes signed PSBTs.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10" fill="#9bbc9c"/></marker></defs><rect width="760" height="683" rx="12" fill="#141b17"/><text x="36" y="48" fill="#f0c386" font-family="monospace" font-size="24">One cartridge, two cooperating computers</text>
<rect x="36" y="85" width="688" height="94" rx="6" fill="#202b23" stroke="#485b4a"/><text x="58" y="119" fill="#ecf0e7" font-family="monospace" font-size="21">Game Boy Color / Advance / SP</text><text x="58" y="151" fill="#becabc" font-family="sans-serif" font-size="18">Buttons + 160 × 144 display + patched Crystal frontend</text>
<path d="M380 179V201" stroke="#9bbc9c" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="36" y="207" width="688" height="94" rx="6" fill="#202b23" stroke="#485b4a"/><text x="58" y="241" fill="#ecf0e7" font-family="monospace" font-size="21">Cartridge bus → paged command interface</text><text x="58" y="273" fill="#becabc" font-family="sans-serif" font-size="18">Command, ticket, page → stable response snapshot</text>
<path d="M380 301V323" stroke="#9bbc9c" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="36" y="329" width="688" height="94" rx="6" fill="#202b23" stroke="#485b4a"/><text x="58" y="363" fill="#ecf0e7" font-family="monospace" font-size="21">RP2350: mapper + signer worker</text><text x="58" y="395" fill="#becabc" font-family="sans-serif" font-size="18">Core 0 serves the game; core 1 owns signing and SD work</text>
<path d="M380 423V445" stroke="#9bbc9c" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="36" y="451" width="688" height="94" rx="6" fill="#202b23" stroke="#485b4a"/><text x="58" y="485" fill="#ecf0e7" font-family="monospace" font-size="21">microSD: games, saves, unsigned and signed PSBTs</text><text x="58" y="517" fill="#becabc" font-family="sans-serif" font-size="18">FAT32; the seed is not intentionally persisted</text>
<text x="36" y="651" fill="#becabc" font-family="sans-serif" font-size="17">The desktop wallet constructs transactions and finalizes signed PSBTs.</text></svg>