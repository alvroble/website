<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 683" role="img" aria-labelledby="title desc"><title id="title">From a transaction proposal to a signature</title><desc id="desc">The public synthetic fixture used in this tutorial cannot be broadcast.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10" fill="#9bbc9c"/></marker></defs><rect width="760" height="683" rx="12" fill="#141b17"/><text x="36" y="48" fill="#f0c386" font-family="monospace" font-size="24">From a transaction proposal to a signature</text>
<rect x="36" y="85" width="688" height="94" rx="6" fill="#202b23" stroke="#485b4a"/><text x="58" y="119" fill="#ecf0e7" font-family="monospace" font-size="21">Desktop coordinator → unsigned binary PSBT</text><text x="58" y="151" fill="#becabc" font-family="sans-serif" font-size="18">One input, one or two outputs, required ownership metadata</text>
<path d="M380 179V201" stroke="#9bbc9c" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="36" y="207" width="688" height="94" rx="6" fill="#202b23" stroke="#485b4a"/><text x="58" y="241" fill="#ecf0e7" font-family="monospace" font-size="21">microSD → cartridge → Crystal review screens</text><text x="58" y="273" fill="#becabc" font-family="sans-serif" font-size="18">Verify account identity, recipients, amounts, change and fee</text>
<path d="M380 301V323" stroke="#9bbc9c" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="36" y="329" width="688" height="94" rx="6" fill="#202b23" stroke="#485b4a"/><text x="58" y="363" fill="#ecf0e7" font-family="monospace" font-size="21">Explicit approval → RP2350 signature → SD export</text><text x="58" y="395" fill="#becabc" font-family="sans-serif" font-size="18">Held review stays bound to the session and transaction</text>
<path d="M380 423V445" stroke="#9bbc9c" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="36" y="451" width="688" height="94" rx="6" fill="#202b23" stroke="#485b4a"/><text x="58" y="485" fill="#ecf0e7" font-family="monospace" font-size="21">Signed PSBT → desktop coordinator</text><text x="58" y="517" fill="#becabc" font-family="sans-serif" font-size="18">Import, verify, finalize; broadcast only disposable test transactions</text>
<text x="36" y="651" fill="#becabc" font-family="sans-serif" font-size="17">The public synthetic fixture used in this tutorial cannot be broadcast.</text></svg>