<article class="post-entry">
  <div class="post-meta"><time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "02 Jan 2006" }}</time><span>{{ .ReadingTime }} min read</span></div>
  <h2><a href="{{ .RelPermalink }}">{{ .Title }}</a></h2>
  <p>{{ .Summary | plainify | truncate 200 }}</p>
  <a class="read-link" href="{{ .RelPermalink }}">Read post →</a>
</article>
