<article class="post-entry">
  <div class="post-meta"><time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date | time.Format ":date_medium" }}</time><span>{{ .ReadingTime }} {{ i18n "reading" }}</span></div>
  <h2><a href="{{ .RelPermalink }}">{{ .Title }}</a></h2>
  <p>{{ .Summary | plainify | truncate 200 }}</p>
  <a class="read-link" href="{{ .RelPermalink }}">{{ i18n "read" }}</a>
</article>
